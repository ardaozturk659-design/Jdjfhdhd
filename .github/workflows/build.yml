name: Build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: src hazirla
        run: |
          if [ ! -d src/main/java ]; then
            Z=$(ls *.zip 2>/dev/null | head -n1)
            if [ -n "$Z" ]; then unzip -oq "$Z"; fi
          fi
          if [ ! -d src/main/java ]; then
            D=$(find . -type d -path '*/src/main/java' | head -n1)
            if [ -n "$D" ]; then cp -r "${D%/main/java}" ./src; fi
          fi
          test -d src/main/java || { echo "HATA: src/main/java yok"; find . -maxdepth 3 -not -path './.git*'; exit 1; }

      - name: Forge build dosyalarini yaz
        run: |
          rm -f build.gradle settings.gradle gradle.properties
          cat > build.gradle <<'GRADLE_EOF'
          buildscript {
              repositories {
                  mavenCentral()
                  jcenter()
                  maven { url = "https://maven.minecraftforge.net" }
                  maven { url = "https://files.minecraftforge.net/maven" }
              }
